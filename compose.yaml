name: llps-explorer

x-backend-image: &backend-image
  image: llps-explorer-backend:0.10.0
  build:
    context: .
    dockerfile: docker/backend/Dockerfile

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
  LLPS_ENVIRONMENT: ${LLPS_ENVIRONMENT:-production}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  PUBLIC_HTTPS: ${PUBLIC_HTTPS:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  STRUCTURED_LOGGING: "true"
  RUN_MIGRATIONS_ON_STARTUP: "false"
  ANALYSIS_QUEUE_BACKEND: rq
  ANALYSIS_RETENTION_DAYS: ${ANALYSIS_RETENTION_DAYS:-7}
  ANALYSIS_CLEANUP_INTERVAL_SECONDS: ${ANALYSIS_CLEANUP_INTERVAL_SECONDS:-3600}
  ANALYSIS_MAX_SEQUENCE_LENGTH: ${ANALYSIS_MAX_SEQUENCE_LENGTH:-50000}
  ANALYSIS_MAX_JOBS: ${ANALYSIS_MAX_JOBS:-128}
  ANALYSIS_MAX_CONCURRENT_JOBS: ${ANALYSIS_MAX_CONCURRENT_JOBS:-1}
  EXTERNAL_RESULT_MAX_ENTRIES: ${EXTERNAL_RESULT_MAX_ENTRIES:-128}
  ANALYSIS_QUEUE_NAME: ${ANALYSIS_QUEUE_NAME:-analysis}
  ANALYSIS_QUEUE_MAX_JOBS: ${ANALYSIS_QUEUE_MAX_JOBS:-128}
  ANALYSIS_OWNER_ACTIVE_JOB_LIMIT: ${ANALYSIS_OWNER_ACTIVE_JOB_LIMIT:-4}
  ANALYSIS_QUEUE_RETRY_MAX: ${ANALYSIS_QUEUE_RETRY_MAX:-2}
  ANALYSIS_QUEUE_RETRY_INTERVAL_SECONDS: ${ANALYSIS_QUEUE_RETRY_INTERVAL_SECONDS:-10}
  ANALYSIS_QUEUE_TTL_SECONDS: ${ANALYSIS_QUEUE_TTL_SECONDS:-3600}
  ANALYSIS_WORKER_RECOVERY_TIMEOUT_SECONDS: ${ANALYSIS_WORKER_RECOVERY_TIMEOUT_SECONDS:-360}
  ANALYSIS_WORKER_MAINTENANCE_INTERVAL_SECONDS: ${ANALYSIS_WORKER_MAINTENANCE_INTERVAL_SECONDS:-30}
  LRECA_SERVICE_URL: ${LRECA_SERVICE_URL:-http://lreca:8001}
  LRECA_SERVICE_TIMEOUT_SECONDS: ${LRECA_SERVICE_TIMEOUT_SECONDS:-150}
  LRECA_SERVICE_CONNECT_TIMEOUT_SECONDS: ${LRECA_SERVICE_CONNECT_TIMEOUT_SECONDS:-5}
  SEG_EXECUTABLE_PATH: ${SEG_EXECUTABLE_PATH:-/opt/ncbi-blast/bin/segmasker}
  SEG_WINDOW: ${SEG_WINDOW:-12}
  SEG_LOCUT: ${SEG_LOCUT:-2.2}
  SEG_HICUT: ${SEG_HICUT:-2.5}
  SEG_TIMEOUT_SECONDS: ${SEG_TIMEOUT_SECONDS:-10}
  ENSEMBLE_THRESHOLD: ${ENSEMBLE_THRESHOLD:-0.5}
  RATE_LIMIT_ANALYSIS_REQUESTS: ${RATE_LIMIT_ANALYSIS_REQUESTS:-10}
  RATE_LIMIT_IMPORT_REQUESTS: ${RATE_LIMIT_IMPORT_REQUESTS:-10}
  RATE_LIMIT_DELETE_REQUESTS: ${RATE_LIMIT_DELETE_REQUESTS:-30}
  RATE_LIMIT_EXPORT_REQUESTS: ${RATE_LIMIT_EXPORT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_IP_MULTIPLIER: ${RATE_LIMIT_IP_MULTIPLIER:-4}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
  FUZDROP_MANUAL_IMPORT_ENABLED: "true"

x-app-security: &app-security
  init: true
  read_only: true
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  reverse-proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ./docker/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  frontend:
    image: llps-explorer-frontend:0.10.0
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  migrate:
    <<: *backend-image
    restart: "no"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment:
      <<: *app-environment
    command: ["alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    networks:
      - app-internal
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: [*backend-image, *app-security]
    restart: unless-stopped
    environment:
      <<: *app-environment
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${BACKEND_WEB_WORKERS:-1}
      - --log-level
      - ${LOG_LEVEL:-info}
    expose:
      - "8000"
    networks:
      - edge
      - app-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-2.0}
          memory: ${BACKEND_MEMORY_LIMIT:-1G}

  worker:
    image: llps-explorer-worker:0.10.0
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      <<: *app-environment
      BLAST_USAGE_REPORT: "false"
    networks:
      - app-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lreca:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/llps/worker_healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-2.0}
          memory: ${WORKER_MEMORY_LIMIT:-2G}

  lreca:
    image: llps-explorer-lreca:0.10.0
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/lreca/Dockerfile
    <<: *app-security
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STRUCTURED_LOGGING: "true"
      LRECA_REPOSITORY: /opt/lreca
      LRECA_PYTHON: /opt/lreca-venv/bin/python
      LRECA_CHECKPOINT_PATH: ${LRECA_CHECKPOINT_PATH:-/models/lreca/human_1_RCNN_ECA_parallel_089-0.9802.pt}
      LRECA_CHECKPOINT_SHA256: ${LRECA_CHECKPOINT_SHA256:?Set the audited checkpoint SHA256}
      LRECA_DEVICE: ${LRECA_DEVICE:-cpu}
      LRECA_KDE_PROMINENCE: ${LRECA_KDE_PROMINENCE:-0.1}
      LRECA_TORCH_THREADS: ${LRECA_TORCH_THREADS:-4}
      LRECA_MAX_CONCURRENT_REQUESTS: ${LRECA_MAX_CONCURRENT_REQUESTS:-1}
      LRECA_MODEL_PROCESSES: "1"
      ANALYSIS_MAX_SEQUENCE_LENGTH: ${ANALYSIS_MAX_SEQUENCE_LENGTH:-50000}
    volumes:
      - type: bind
        source: ${LRECA_MODEL_DIR:?Set LRECA_MODEL_DIR in .env}
        target: /models/lreca
        read_only: true
    expose:
      - "8001"
    shm_size: 512m
    networks:
      - app-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: ${LRECA_CPU_LIMIT:-4.0}
          memory: ${LRECA_MEMORY_LIMIT:-8G}

  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    read_only: true
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/postgresql:rw,nosuid,size=16m
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    read_only: true
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  edge:
    driver: bridge
  app-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
