[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llps-explorer-backend"
version = "0.10.0"
description = "Capability-routed protein analysis jobs and experimental weighted scores"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "SQLAlchemy==2.0.43",
  "alembic==1.16.5",
  "psycopg==3.2.10",
  "psycopg-binary==3.2.10; platform_system == 'Windows'",
  "tzdata==2025.2; platform_system == 'Windows'",
  "redis==7.1.1",
  "rq==2.12.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "lreca_runtime*", "lreca_service*"]

[tool.setuptools.package-data]
"app.persistence.alembic" = ["README", "script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "lreca_runtime", "lreca_service"]
